<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>María Carolina Salcedo — Artista visual & Educación artística</title>
  <meta name="description" content="Portafolio bilingüe (ES/EN) de María Carolina Salcedo: bio, exposiciones, educación artística y proyectos." />
  <style>
    :root{
      --bg:#ffffff;--text:#0f172a;--muted:#475569;--line:#e2e8f0;--card:#ffffff;
      --accent:#0ea5e9;--shadow:0 8px 30px rgba(2,6,23,.08);
      --radius:18px;--max:1100px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial;
      color:var(--text);background:var(--bg);line-height:1.55}
    a{color:inherit;text-decoration:none}
    a:hover{color:var(--accent)}
    .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(10px);
      border-bottom:1px solid var(--line)}
    .navwrap{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px 18px}
    .brand{display:flex;flex-direction:column;gap:2px;min-width:220px}
    .brand b{font-size:14px}
    .brand span{font-size:12px;color:var(--muted)}
    .nav{display:flex;gap:14px;flex:1;flex-wrap:wrap}
    .nav a{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:999px}
    .nav a.active{color:var(--text);background:#f1f5f9}
    .actions{display:flex;gap:10px;align-items:center}
    .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:13px;
      display:inline-flex;gap:8px;align-items:center;cursor:pointer}
    .btn.primary{border-color:rgba(14,165,233,.25);background:rgba(14,165,233,.08)}
    .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
    .lang button{border:0;background:#fff;padding:8px 10px;font-size:12px;color:var(--muted);cursor:pointer}
    .lang button.active{background:#f1f5f9;color:var(--text)}
    .container{max-width:var(--max);margin:0 auto;padding:28px 18px 80px}
    .hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
    @media (max-width:900px){.hero{grid-template-columns:1fr}}
    .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .heroLeft{padding:26px}
    h1{margin:10px 0 6px;font-size:38px}
    .lede{font-size:16px}
    .heroRight{padding:18px}
    .imgph img{width:100%;height:100%;object-fit:cover;border-radius:16px}
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <div class="panel heroLeft">
        <h1>María Carolina Salcedo</h1>
        <p class="lede">
          Artista visual, educadora e investigadora. Su práctica explora el cuerpo,
          la memoria y la pedagogía como herramientas de transformación social.
        </p>
        <a class="btn primary" href="mailto:mariacarosalcedoculturapereira@gmail.com">
          ✉️ Contacto
        </a>
      </div>
      <div class="panel heroRight">
        <div class="imgph">
          <img src="Foto website CAro.avif" alt="María Carolina Salcedo">
        </div>
      </div>
    </section>
  </main>
</body>
</html>
